let currentLanguage = "de";
function tr() { return translations[currentLanguage]; }

function applyLanguage() {
  const text = tr();
  document.documentElement.lang = currentLanguage;
  document.title = text.mainTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = text[el.dataset.i18n] || ""; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = text[el.dataset.i18nHtml] || ""; });
  document.querySelectorAll("[data-question]").forEach(el => { el.textContent = text.questions[el.dataset.question] || ""; });
  document.querySelectorAll("[data-hint]").forEach(el => { el.textContent = text.hints[el.dataset.hint] || ""; });
  document.getElementById("result").style.display = "none";
}

function setSectionRequired(section, isRequired) {
  if (!section) return;
  section.querySelectorAll('input[type="radio"]').forEach(input => {
    input.required = isRequired;
    input.disabled = !isRequired;
  });
}
function showSection(section, shouldShow) {
  if (!section) return;
  section.style.display = shouldShow ? "block" : "none";
  setSectionRequired(section, shouldShow);
}
function updateVisibleSections(value) {
  const instruktivePassung = document.getElementById("instruktivePassungSection");
  const lernen = document.getElementById("lernenSection");
  const pruefen = document.getElementById("pruefenSection");
  if (value === "LehrenLernen") {
    showSection(instruktivePassung, true); showSection(lernen, true); showSection(pruefen, false);
  } else if (value === "Pruefen") {
    showSection(instruktivePassung, false); showSection(lernen, false); showSection(pruefen, true);
  } else if (value === "Beides") {
    showSection(instruktivePassung, true); showSection(lernen, true); showSection(pruefen, true);
  }
}
document.getElementById("languageSelect").addEventListener("change", function() {
  currentLanguage = this.value; applyLanguage();
});
document.querySelectorAll('input[name="evaluation_type"]').forEach(radio => {
  radio.addEventListener("change", function() { updateVisibleSections(this.value); });
});

document.getElementById("assessmentForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const data = new FormData(e.target);
  let rawSum = 0, count = 0, weightedSum = 0, weightSum = 0;
  const answers = {};
  let experienceLevel = "";
  for (const [question, value] of data.entries()) {
    if (question === "experience_level") { experienceLevel = value; continue; }
    if (question === "evaluation_type") continue;
    if (value === "") continue;
    const numericValue = Number(value);
    const weight = weights[experienceLevel][question] || 1;
    answers[question] = numericValue;
    rawSum += numericValue; count++;
    weightedSum += numericValue * weight; weightSum += weight;
  }
  const unweightedAverage = rawSum / count;
  const weightedAverage = weightedSum / weightSum;
  const dimensionResults = {};
  for (const [dimensionKey, questions] of Object.entries(dimensions)) {
    let dimWeightedSum = 0, dimWeightSum = 0, dimRawSum = 0, dimCount = 0;
    questions.forEach(question => {
      if (answers[question] !== undefined) {
        const value = answers[question];
        const weight = weights[experienceLevel][question] || 1;
        dimWeightedSum += value * weight; dimWeightSum += weight;
        dimRawSum += value; dimCount++;
      }
    });
    if (dimCount > 0 && dimWeightSum > 0) {
      const dimensionName = tr()[dimensionKey];
      dimensionResults[dimensionName] = { weighted: dimWeightedSum / dimWeightSum, unweighted: dimRawSum / dimCount };
    }
  }
  let recommendation = "";
  if (weightedAverage >= 4) recommendation = tr().recGood;
  else if (weightedAverage >= 3.5) recommendation = tr().recConditional;
  else recommendation = tr().recPoor;

  document.getElementById("scoreText").textContent = tr().totalScore + ": " + weightedAverage.toFixed(2) + " / 5";
  document.getElementById("recommendationText").textContent = tr().overallRecommendation + ": " + recommendation;

  const dimensionScoresDiv = document.getElementById("dimensionScores");
  dimensionScoresDiv.innerHTML = "";
  for (const [dimensionName, scores] of Object.entries(dimensionResults)) {
    const p = document.createElement("p");
    p.innerHTML = "<strong>" + dimensionName + ":</strong> " + scores.weighted.toFixed(2) + " / 5";
    dimensionScoresDiv.appendChild(p);
  }

  const actionList = document.getElementById("actionRecommendations");
  actionList.innerHTML = "";
  for (const [question, value] of Object.entries(answers)) {
    if (value <= 2) {
      const item = document.createElement("li");
      item.innerHTML = "<strong>" + tr().labels[question] + ":</strong> " + tr().actions[question];
      actionList.appendChild(item);
    }
  }
  if (actionList.children.length === 0) {
    const item = document.createElement("li");
    item.textContent = tr().noActions;
    actionList.appendChild(item);
  }
  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
  if (!supabaseClient) return;
  try {
    const { error } = await supabaseClient.from("responses").insert([{
      experience_level: experienceLevel,
      answers: answers,
      average_score: weightedAverage,
      recommendation: recommendation,
      unweighted_score: unweightedAverage,
      action_recommendations: Array.from(actionList.children).map(item => item.textContent)
    }]);
    if (error) { console.error("Fehler beim Speichern:", error); alert(tr().saveError); }
  } catch (err) { console.error("Unerwarteter Fehler:", err); }
});
